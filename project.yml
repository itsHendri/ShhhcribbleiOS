name: ShhhcribbleiOS
options:
  bundleIdPrefix: com.shhhcribble
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

schemes:
  ShhhcribbleiOS:
    build:
      targets:
        ShhhcribbleShared: all
        ShhhcribbleWidget: all
        ShhhcribbleiOS: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ShhhcribbleiOSTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

packages:
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    # Exact pin. The Mac app must use the same version (see ECOSYSTEM.md).
    exactVersion: 0.18.3
  # The library, text pipeline and sync shared with the Mac app. A local
  # path: this repo builds only with the Mac repo checked out beside it
  # (brands/shhhcribble/projects/mac-app).
  ShhhcribbleCore:
    path: ../mac-app/Core

targets:
  ShhhcribbleShared:
    type: framework
    platform: iOS
    sources:
      - path: ShhhcribbleShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shhhcribble.ios.shared
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: L9T3PX7HVH
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
        DEFINES_MODULE: YES
        BUILD_LIBRARY_FOR_DISTRIBUTION: NO

  ShhhcribbleiOS:
    type: application
    platform: iOS
    sources:
      - path: ShhhcribbleiOS
        excludes:
          - Info.plist
          - ShhhcribbleiOS.entitlements
    resources:
      - ShhhcribbleiOS/Resources/Assets.xcassets
    info:
      path: ShhhcribbleiOS/Info.plist
      properties:
        CFBundleDisplayName: Shhhcribble
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        CFBundleURLTypes:
          - CFBundleURLName: com.shhhcribble.ios
            CFBundleURLSchemes:
              - shhhcribble
        LSRequiresIPhoneOS: true
        # Audio files can be opened in the app from Files or a share sheet.
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Audio
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.audio
        NSMicrophoneUsageDescription: "Shhhcribble records audio to transcribe your speech. Recording only happens when you trigger it."
        NSCalendarsWriteOnlyAccessUsageDescription: "Shhhcribble adds a meeting you spoke to your calendar, only when you tap Add to Calendar. It never reads your calendar."
        NSSupportsLiveActivities: true
        UIBackgroundModes:
          - audio
          # CKSyncEngine hears of changes from the Mac through silent pushes.
          - remote-notification
        # The build carries the iCloud entitlement (see entitlements below).
        # SyncService refuses to touch CloudKit without it.
        ShhhCloudKitEnabled: true
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities:
          - microphone
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    entitlements:
      path: ShhhcribbleiOS/ShhhcribbleiOS.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.shhhcribble
        # iCloud sync, the same private container as the Mac app. Keep in step
        # with ShhhCloudKitEnabled in the Info.plist above.
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.shhhcribble.library
        com.apple.developer.icloud-services:
          - CloudKit
        aps-environment: development
        # Reminders may break through a Focus, as Apple Reminders does.
        com.apple.developer.usernotifications.time-sensitive: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shhhcribble.ios
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: L9T3PX7HVH
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - target: ShhhcribbleShared
        embed: true
      - package: FluidAudio
        product: FluidAudio
      - package: ShhhcribbleCore
        product: ShhhcribbleCore
      - target: ShhhcribbleWidget
        embed: true

  ShhhcribbleWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: ShhhcribbleWidget
        excludes:
          - ShhhcribbleWidget.entitlements
      # Multi-target source membership: the widget needs StartRecordingIntent
      # for its Control Center button, and Stop/Cancel intents for the Live
      # Activity card. Apple's recommended pattern (since iOS 18) is to share
      # the intent .swift files between targets directly rather than via a
      # framework — AppShortcutsProvider in the main app only registers with
      # iOS when the referenced intents live in the main app target. Adding
      # them here too means each target compiles its own copy.
      - path: ShhhcribbleiOS/App/Intents/StartRecordingIntent.swift
      - path: ShhhcribbleiOS/App/Intents/StopRecordingIntent.swift
      - path: ShhhcribbleiOS/App/Intents/CancelRecordingIntent.swift
      # Where the library is and how a due time reads: one copy of the rule.
      - path: ShhhcribbleiOS/Services/LibraryLocation.swift
    info:
      path: ShhhcribbleWidget/Info.plist
      properties:
        CFBundleDisplayName: Shhhcribble Widget
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: ShhhcribbleWidget/ShhhcribbleWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.shhhcribble
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shhhcribble.ios.widget
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: L9T3PX7HVH
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
    dependencies:
      - target: ShhhcribbleShared
        embed: false
      # The home-screen widgets read tasks and the latest note through the
      # core's LibraryReader. One product for now, so the widget links all of
      # it; the Mac track plans a smaller module for extensions.
      - package: ShhhcribbleCore
        product: ShhhcribbleCore

  ShhhcribbleiOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ShhhcribbleiOSTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shhhcribble.ios.tests
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: L9T3PX7HVH
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: ShhhcribbleiOS
